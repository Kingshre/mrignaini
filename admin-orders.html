<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Orders | Mrignaini</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="assets/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header class="admin-header">
        <div class="left">
            <h1><span class="dot"></span> Mrignaini Admin</h1>
            <nav class="admin-tabs" hidden>
                <a href="admin-orders.html" class="active">Orders</a>
                <a href="admin-products.html">Products</a>
            </nav>
        </div>
        <div class="header-right">
            <span class="header-meta" id="lastUpdated"></span>
            <span class="header-meta" id="adminEmail"></span>
            <button class="btn" id="signOutBtn" hidden>Sign out</button>
        </div>
    </header>

    <!-- Admin Login -->
    <div class="login-wrap" id="loginView" hidden>
        <form class="login-card" id="loginForm">
            <h2>Admin sign in</h2>
            <p class="login-sub">Only Mrignaini admins can view orders.</p>
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" autocomplete="username" required>
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" autocomplete="current-password" required>
            <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>
            <p class="login-msg" id="loginMsg" role="alert"></p>
        </form>
    </div>

    <div class="container" id="dashboardView" hidden>
        <!-- Stats (paid, non-test orders) -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Total Orders</div>
                <div class="stat-value" id="statTotal">–</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Today (IST)</div>
                <div class="stat-value" id="statToday">–</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Revenue</div>
                <div class="stat-value" id="statRevenue">–</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">To ship</div>
                <div class="stat-value" id="statToShip">–</div>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="card">
            <div class="card-header">
                <h2>Orders <span class="header-meta" id="resultCount"></span></h2>
                <button class="btn btn-primary" id="refreshBtn">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        <path d="M1 8a7 7 0 0113.1-3.5M15 8a7 7 0 01-13.1 3.5" />
                        <path d="M14 1v3.5h-3.5M2 15v-3.5h3.5" />
                    </svg>
                    Refresh
                </button>
            </div>

            <div class="toolbar">
                <input type="search" id="searchInput" placeholder="Search name, phone, email, order no." aria-label="Search orders">
                <div class="chips" id="statusChips" role="group" aria-label="Filter by status">
                    <button class="chip active" data-status="all">All</button>
                    <button class="chip" data-status="pending">Pending</button>
                    <button class="chip" data-status="confirmed">Confirmed</button>
                    <button class="chip" data-status="shipped">Shipped</button>
                    <button class="chip" data-status="delivered">Delivered</button>
                    <button class="chip" data-status="cancelled">Cancelled</button>
                </div>
                <label class="toggle-label"><input type="checkbox" id="showUnpaid"> Show unpaid checkouts</label>
                <label class="toggle-label"><input type="checkbox" id="showTest"> Show test orders</label>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Contact</th>
                            <th>Address</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Payment ID</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody"></tbody>
                </table>
            </div>

            <div class="state-msg" id="loadingState">
                <div class="spinner"></div>
                Loading orders…
            </div>
            <div class="state-msg hidden" id="errorState">Failed to load orders.</div>
            <div class="state-msg hidden" id="emptyState">No orders match.</div>
        </div>
    </div>

    <!-- Order Detail Drawer -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer" id="drawer" role="dialog" aria-labelledby="drawerTitle">
        <div class="drawer-header">
            <h3 id="drawerTitle">Order Details</h3>
            <button class="drawer-close" id="drawerClose" aria-label="Close">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M4 4l8 8M12 4l-8 8" />
                </svg>
            </button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="products.js"></script>
    <script src="admin.js"></script>
    <script>
        const STATUSES = ['pending', 'confirmed', 'shipped', 'delivered', 'cancelled'];
        let orders = [];
        let productNames = new Map();
        const filters = { status: 'all', q: '', unpaid: false, test: false };

        const isPaid = o => o.payment_status ? o.payment_status === 'paid' : !!o.payment_id;

        // New orders store the product name; older ones only a productId,
        // sometimes with a colour suffix (e.g. top-basanti-blue).
        function productName(item) {
            if (item.name) return item.name;
            const id = item.productId || '';
            for (let key = id; key; key = key.includes('-') ? key.slice(0, key.lastIndexOf('-')) : '') {
                if (productNames.has(key)) return productNames.get(key);
            }
            return id || 'Item';
        }

        function parseItems(o) {
            try {
                const items = typeof o.items === 'string' ? JSON.parse(o.items) : o.items;
                return Array.isArray(items) ? items : [];
            } catch { return []; }
        }

        const itemMeta = i => [i.color, i.size ? `Size ${i.size}` : ''].filter(Boolean).join(' · ');

        function formatDate(value) {
            if (!value) return { date: '—', time: '' };
            const d = new Date(value);
            return {
                date: d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: '2-digit', timeZone: IST }),
                time: d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', timeZone: IST })
            };
        }

        function fullAddress(o) {
            let addr = o.address || '';
            for (const part of [o.city, o.state, o.pincode]) {
                if (part && !addr.includes(part)) addr += (addr ? ', ' : '') + part;
            }
            return addr;
        }

        const statusBadge = s => `<span class="badge badge-${esc(s || 'pending')}">${esc(s || 'pending')}</span>`;
        const paymentBadge = o => isPaid(o) ? '' : `<div><span class="badge badge-unpaid">payment ${esc(o.payment_status || 'unpaid')}</span></div>`;
        const testBadge = o => o.is_test ? ' <span class="badge badge-test">test</span>' : '';

        // ── Load ──
        async function fetchOrders() {
            const loading = document.getElementById('loadingState');
            const error = document.getElementById('errorState');
            loading.classList.remove('hidden');
            error.classList.add('hidden');
            try {
                if (!productNames.size) {
                    const products = await Catalog.load().catch(() => []);
                    productNames = new Map(products.map(p => [p.id, p.name]));
                }
                const { data, error: err } = await sb
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false, nullsFirst: false });
                if (err) throw err;
                orders = data || [];
                updateStats();
                render();
                document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN', { timeZone: IST });
            } catch (e) {
                console.error('Fetch error:', e);
                error.classList.remove('hidden');
                error.textContent = 'Error loading orders: ' + (e.message || e);
            } finally {
                loading.classList.add('hidden');
            }
        }

        // Stats count real, paid orders only (no test orders or unpaid checkouts; revenue excludes cancellations)
        function updateStats() {
            const real = orders.filter(o => isPaid(o) && !o.is_test);
            const live = real.filter(o => o.status !== 'cancelled');
            const istDay = d => new Date(d).toLocaleDateString('en-CA', { timeZone: IST });
            const today = istDay(Date.now());
            document.getElementById('statTotal').textContent = real.length;
            document.getElementById('statToday').textContent = real.filter(o => o.created_at && istDay(o.created_at) === today).length;
            document.getElementById('statRevenue').textContent = formatINR(live.reduce((s, o) => s + Number(o.total || 0), 0));
            document.getElementById('statToShip').textContent = real.filter(o => o.status === 'pending' || o.status === 'confirmed').length;
        }

        function visibleOrders() {
            const q = filters.q.toLowerCase();
            return orders.filter(o =>
                (filters.unpaid || isPaid(o)) &&
                (filters.test || !o.is_test) &&
                (filters.status === 'all' || (o.status || 'pending') === filters.status) &&
                (!q || [o.customer_name, o.phone, o.email, o.order_number].some(v => String(v || '').toLowerCase().includes(q)))
            );
        }

        function render() {
            const list = visibleOrders();
            document.getElementById('resultCount').textContent = `(${list.length})`;
            document.getElementById('emptyState').classList.toggle('hidden', list.length > 0);
            document.getElementById('ordersBody').innerHTML = list.map(o => {
                const { date, time } = formatDate(o.created_at);
                const items = parseItems(o);
                const itemsHtml = items.length
                    ? items.map(i => `<div class="item-line">${esc(i.qty || 1)}× ${esc(productName(i))}
                        <div class="item-meta">${esc(itemMeta(i))}</div></div>`).join('')
                    : '<span style="color:var(--text-muted)">—</span>';
                return `<tr data-id="${esc(o.id)}" style="cursor:pointer">
                    <td class="col-order">${esc(o.order_number || '—')}${testBadge(o)}</td>
                    <td class="col-date">${esc(date)}<br>${esc(time)}</td>
                    <td class="col-name">${esc(o.customer_name || '—')}</td>
                    <td class="col-contact">${esc(o.phone)}<br>${esc(o.email)}</td>
                    <td class="col-address">${esc(fullAddress(o) || '—')}</td>
                    <td class="col-items">${itemsHtml}</td>
                    <td class="col-total">${formatINR(o.total)}</td>
                    <td class="col-payment">${esc(o.payment_id || '—')}</td>
                    <td>${statusBadge(o.status)}${paymentBadge(o)}</td>
                    <td><button class="btn">View</button></td>
                </tr>`;
            }).join('');
        }

        document.getElementById('ordersBody').addEventListener('click', e => {
            const tr = e.target.closest('tr[data-id]');
            if (tr) openDrawer(tr.dataset.id);
        });

        // ── Filters ──
        document.getElementById('searchInput').addEventListener('input', e => { filters.q = e.target.value.trim(); render(); });
        document.getElementById('statusChips').addEventListener('click', e => {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            filters.status = chip.dataset.status;
            document.querySelectorAll('#statusChips .chip').forEach(c => c.classList.toggle('active', c === chip));
            render();
        });
        document.getElementById('showUnpaid').addEventListener('change', e => { filters.unpaid = e.target.checked; render(); });
        document.getElementById('showTest').addEventListener('change', e => { filters.test = e.target.checked; render(); });
        document.getElementById('refreshBtn').addEventListener('click', fetchOrders);

        // ── Drawer ──
        let drawerOrderId = null;

        function openDrawer(id) {
            const o = orders.find(x => x.id === id);
            if (!o) return;
            drawerOrderId = id;
            document.getElementById('drawerTitle').textContent = o.order_number || 'Order Details';

            const items = parseItems(o);
            const itemsHtml = items.length
                ? items.map(i => `<div class="detail-row"><span class="label">${esc(i.qty || 1)}× ${esc(productName(i))}<br><small>${esc(itemMeta(i))}</small></span><span class="value">${i.lineTotal != null ? formatINR(i.lineTotal) : ''}</span></div>`).join('')
                : '<div class="detail-row"><span class="label">No items data</span></div>';

            const row = (label, value, style = '') =>
                `<div class="detail-row"><span class="label">${label}</span><span class="value" style="${style}">${esc(value || '—')}</span></div>`;

            document.getElementById('drawerBody').innerHTML = `
                <div class="detail-section">
                    <h4>Status</h4>
                    <div class="detail-row" style="gap:0.5rem;align-items:center">
                        <select class="status-select" id="statusSelect" aria-label="Order status">
                            ${STATUSES.map(s => `<option value="${s}" ${s === (o.status || 'pending') ? 'selected' : ''}>${s[0].toUpperCase() + s.slice(1)}</option>`).join('')}
                        </select>
                        <button class="btn btn-primary" id="saveStatusBtn">Update status</button>
                    </div>
                    ${o.stock_applied && o.status === 'cancelled' ? `
                        <div class="detail-row" style="align-items:center;gap:0.5rem"><span class="label">Items from this cancelled order are still deducted from stock.</span>
                        <button class="btn" id="restockBtn">Return to stock</button></div>` : ''}
                </div>
                <div class="detail-section">
                    <h4>Order Info</h4>
                    ${row('Order Number', o.order_number)}
                    ${row('Date', o.created_at ? new Date(o.created_at).toLocaleString('en-IN', { timeZone: IST }) + ' IST' : '')}
                    ${o.subtotal != null ? row('Subtotal', formatINR(o.subtotal)) : ''}
                    ${o.shipping != null ? row('Shipping', formatINR(o.shipping)) : ''}
                    ${row('Total', formatINR(o.total), 'font-weight:700;color:var(--accent)')}
                    ${o.stock_issue ? `<div class="detail-row"><span class="label" style="color:var(--danger-text)">⚠ ${esc(o.stock_issue)}</span></div>` : ''}
                </div>
                <div class="detail-section">
                    <h4>Customer</h4>
                    ${row('Name', o.customer_name)}
                    ${row('Phone', o.phone)}
                    ${row('Email', o.email)}
                </div>
                <div class="detail-section">
                    <h4>Shipping Address</h4>
                    ${row('Address', o.address)}
                    ${row('City', o.city)}
                    ${row('State', o.state)}
                    ${row('Pincode', o.pincode)}
                </div>
                <div class="detail-section">
                    <h4>Items</h4>
                    ${itemsHtml}
                </div>
                <div class="detail-section">
                    <h4>Payment</h4>
                    ${row('Payment status', o.payment_status || (o.payment_id ? 'paid' : 'unpaid'))}
                    ${row('Payment ID', o.payment_id, 'font-family:monospace;font-size:0.75rem')}
                    ${row('Razorpay Order ID', o.razorpay_order_id, 'font-family:monospace;font-size:0.75rem')}
                </div>
            `;

            document.getElementById('saveStatusBtn').addEventListener('click', saveStatus);
            const restockBtn = document.getElementById('restockBtn');
            if (restockBtn) restockBtn.addEventListener('click', () => restock(o.id));

            document.getElementById('drawerOverlay').classList.add('active');
            document.getElementById('drawer').classList.add('active');
        }

        async function saveStatus() {
            const o = orders.find(x => x.id === drawerOrderId);
            const status = document.getElementById('statusSelect').value;
            if (!o || status === (o.status || 'pending')) return;
            const btn = document.getElementById('saveStatusBtn');
            btn.disabled = true;
            const { data, error } = await sb.from('orders').update({ status }).eq('id', o.id).select().single();
            btn.disabled = false;
            if (error) { toast('Could not update status: ' + error.message, false); return; }
            Object.assign(o, data);
            toast(`${o.order_number} → ${status}`);
            updateStats();
            render();
            if (status === 'cancelled' && o.stock_applied &&
                confirm(`Return the items from ${o.order_number} to stock?`)) {
                await restock(o.id);
            } else {
                openDrawer(o.id);
            }
        }

        async function restock(id) {
            const { data, error } = await sb.rpc('restock_order', { p_order_id: id });
            if (error) { toast('Could not restock: ' + error.message, false); return; }
            const o = orders.find(x => x.id === id);
            Object.assign(o, data);
            toast('Items returned to stock');
            openDrawer(id);
        }

        function closeDrawer() {
            document.getElementById('drawerOverlay').classList.remove('active');
            document.getElementById('drawer').classList.remove('active');
            drawerOrderId = null;
        }
        document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
        document.getElementById('drawerClose').addEventListener('click', closeDrawer);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

        document.addEventListener('DOMContentLoaded', () => Admin.init(fetchOrders));
    </script>
</body>

</html>
